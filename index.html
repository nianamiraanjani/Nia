<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nia Life · Syarat Skripsi</title>
<style>
:root{--bg:#f3faf6;--card:#fff;--tx:#12372a;--mu:#5f7f72;--g:#059669;--gl:#d1fae5;--bd:#cfe8dc}
@media (prefers-color-scheme:dark){:root{--bg:#0d1f18;--card:#152b22;--tx:#e3f5ec;--mu:#8db5a3;--g:#34d399;--gl:#1d4535;--bd:#25483a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:16px 14px 80px;max-width:640px;margin:auto}
h1{font-size:22px;margin:6px 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 4px}.mu{color:var(--mu);font-size:12.5px}
.bar{height:10px;background:var(--gl);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .3s}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}
.row input[type=text],.row input[type=number],.row input[type=date],textarea,select{flex:1;min-width:0;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--g);flex:none}
input[type=range]{flex:1;accent-color:var(--g)}
button{border:0;border-radius:10px;background:var(--g);color:#fff;padding:9px 13px;font:inherit;font-size:14px}
button.x{background:transparent;color:var(--mu);padding:6px 9px}
.done input[type=text]{text-decoration:line-through;color:var(--mu)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.s{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:10px;padding:7px 9px;font-size:13.5px}
.big{font-size:28px;font-weight:700;color:var(--g)}
.pill{display:inline-block;background:var(--gl);color:var(--g);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
</style>
</head>
<body>
<h1>Hai, Nia 🌿</h1>
<div class="sub">Syarat skripsi dan progres penelitian</div>
<div id="app"></div>
<script>
var K='nialife_skripsi_v1';
var SURAT=['An-Naba','An-Nazi\u2019at','\u2018Abasa','At-Takwir','Al-Infithar','Al-Muthaffifin','Al-Insyiqaq','Al-Buruj','Ath-Thariq','Al-A\u2019la','Al-Ghasyiyah','Al-Fajr','Al-Balad','Asy-Syams','Al-Lail','Adh-Dhuha','Asy-Syarh','At-Tin','Al-\u2018Alaq','Al-Qadr','Al-Bayyinah','Az-Zalzalah','Al-\u2018Adiyat','Al-Qari\u2019ah','At-Takatsur','Al-\u2018Ashr','Al-Humazah','Al-Fil','Quraisy','Al-Ma\u2019un','Al-Kautsar','Al-Kafirun','An-Nashr','Al-Lahab','Al-Ikhlas','Al-Falaq','An-Nas'];
var def={
 hafalan:SURAT.map(function(n){return {t:n,d:false}}),
 toefl:{min:400,target:500,hist:[{date:'',skor:383,cat:'Skor awal'}],ulang:true,tglUlang:''},
 magang:{tgl:'',items:[{t:'Laporan magang selesai',d:false},{t:'PPT seminar hasil magang',d:false},{t:'Konsultasi dengan dosen pembimbing',d:false},{t:'Daftar seminar',d:false},{t:'Seminar hasil magang',d:false},{t:'Revisi laporan magang',d:false}]},
 revisi:[],
 riset:[{t:'Proposal penelitian',p:100},{t:'Persiapan bahan (cabai, pati singkong, sorbitol)',p:0},{t:'Pembuatan larutan edible coating',p:0},{t:'Aplikasi coating (celup, 4 perlakuan x 5 ulangan)',p:0},{t:'Pengamatan parameter',p:0},{t:'Analisis data (ANOVA)',p:0},{t:'Penyusunan skripsi',p:0}]
};
var S;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S)S=JSON.parse(JSON.stringify(def));
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function pct(a,b){return b?Math.round(a*100/b):0}
function bar(p){return '<div class="bar"><i style="width:'+p+'%"></i></div>'}

function render(){
 var h='';
 // Hafalan
 var hd=S.hafalan.filter(function(x){return x.d}).length,hp=pct(hd,S.hafalan.length);
 h+='<div class="card"><h2>📖 Hafalan Juz 30 (syarat skripsi)</h2><div class="mu">'+hd+' dari '+S.hafalan.length+' surat \u00b7 '+hp+'%</div>'+bar(hp)+'<div class="grid">';
 S.hafalan.forEach(function(x,i){h+='<label class="s"><input type="checkbox" data-a="haf" data-i="'+i+'"'+(x.d?' checked':'')+'>'+esc(x.t)+'</label>'});
 h+='</div></div>';
 // TOEFL
 var T=S.toefl,last=T.hist.length?Number(T.hist[T.hist.length-1].skor)||0:0,sisa=Math.max(0,T.min-last),tp=Math.min(100,pct(last,T.min));
 h+='<div class="card"><h2>🎯 Progres TOEFL</h2><div class="big">'+last+' <span class="mu">/ minimal '+T.min+'</span></div>'+bar(tp)+'<div class="mu">'+(sisa?'Kurang '+sisa+' poin lagi untuk lolos syarat':'Sudah memenuhi syarat minimal \u2705')+'</div>';
 h+='<div class="row" style="margin-top:10px"><label class="mu" style="width:92px">Skor minimal</label><input type="number" value="'+T.min+'" data-a="tmin"></div>';
 h+='<div class="row"><label class="mu" style="width:92px">Target pribadi</label><input type="number" value="'+T.target+'" data-a="ttar"></div>';
 h+='<div class="row"><input type="checkbox" data-a="tul"'+(T.ulang?' checked':'')+'><span style="font-size:14px">Perlu tes ulang 1x</span></div>';
 h+='<div class="row"><label class="mu" style="width:92px">Tanggal ulang</label><input type="date" value="'+esc(T.tglUlang)+'" data-a="ttgl"></div>';
 h+='<div class="mu" style="margin-top:8px">Riwayat skor</div>';
 T.hist.forEach(function(x,i){h+='<div class="row"><input type="date" value="'+esc(x.date)+'" data-a="hd" data-i="'+i+'" style="max-width:140px"><input type="number" value="'+esc(x.skor)+'" data-a="hs" data-i="'+i+'" style="max-width:80px"><input type="text" value="'+esc(x.cat)+'" data-a="hc" data-i="'+i+'"><button class="x" data-a="hx" data-i="'+i+'">\u2715</button></div>'});
 h+='<button data-a="hadd">+ Tambah skor</button></div>';
 // Seminar magang
 var M=S.magang,md=M.items.filter(function(x){return x.d}).length,mp=pct(md,M.items.length);
 h+='<div class="card"><h2>🌽 Seminar Hasil Magang</h2><div class="mu">'+md+' dari '+M.items.length+' langkah \u00b7 '+mp+'%</div>'+bar(mp);
 h+='<div class="row"><label class="mu" style="width:92px">Tgl seminar</label><input type="date" value="'+esc(M.tgl)+'" data-a="mtgl"></div>';
 M.items.forEach(function(x,i){h+='<div class="row'+(x.d?' done':'')+'"><input type="checkbox" data-a="md" data-i="'+i+'"'+(x.d?' checked':'')+'><input type="text" value="'+esc(x.t)+'" data-a="mt" data-i="'+i+'"><button class="x" data-a="mx" data-i="'+i+'">\u2715</button></div>'});
 h+='<button data-a="madd">+ Tambah langkah</button></div>';
 // Revisi
 var rd=S.revisi.filter(function(x){return x.d}).length;
 h+='<div class="card"><h2>✏️ Revisi</h2><div class="mu">'+(S.revisi.length?rd+' dari '+S.revisi.length+' revisi selesai':'Belum ada revisi. Tambahkan dari catatan dosen.')+'</div>'+bar(pct(rd,S.revisi.length));
 S.revisi.forEach(function(x,i){h+='<div class="'+(x.d?'done':'')+'" style="margin:8px 0;padding-top:8px;border-top:1px solid var(--bd)"><div class="row"><input type="checkbox" data-a="rd" data-i="'+i+'"'+(x.d?' checked':'')+'><input type="text" value="'+esc(x.t)+'" data-a="rt" data-i="'+i+'" placeholder="Isi revisi"><button class="x" data-a="rx" data-i="'+i+'">\u2715</button></div><div class="row"><input type="text" value="'+esc(x.dari)+'" data-a="rf" data-i="'+i+'" placeholder="Dari siapa / bagian mana" style="font-size:12.5px"><input type="date" value="'+esc(x.dl)+'" data-a="rl" data-i="'+i+'" style="max-width:140px"></div></div>'});
 h+='<button data-a="radd">+ Tambah revisi</button></div>';
 // Riset
 var ra=S.riset.length?Math.round(S.riset.reduce(function(a,x){return a+x.p},0)/S.riset.length):0;
 h+='<div class="card"><h2>🌶️ Progres Penelitian</h2><div class="mu">Edible coating pati singkong + sorbitol pada cabai rawit</div><div class="big">'+ra+'%</div>'+bar(ra);
 S.riset.forEach(function(x,i){h+='<div style="margin:8px 0;padding-top:8px;border-top:1px solid var(--bd)"><div class="row"><input type="text" value="'+esc(x.t)+'" data-a="it" data-i="'+i+'"><button class="x" data-a="ix" data-i="'+i+'">\u2715</button></div><div class="row"><input type="range" min="0" max="100" step="5" value="'+x.p+'" data-a="ip" data-i="'+i+'"><span class="pill" id="p'+i+'">'+x.p+'%</span></div></div>'});
 h+='<button data-a="iadd">+ Tambah tahap</button></div>';
 document.getElementById('app').innerHTML=h;
}

function act(e){
 var el=e.target,a=el.getAttribute('data-a');if(!a)return;
 var i=+el.getAttribute('data-i'),v=el.type==='checkbox'?el.checked:el.value,re=true;
 var T=S.toefl;
 if(a==='haf')S.hafalan[i].d=v;
 else if(a==='tmin')T.min=+v||0;
 else if(a==='ttar')T.target=+v||0;
 else if(a==='tul')T.ulang=v;
 else if(a==='ttgl')T.tglUlang=v;
 else if(a==='hd')T.hist[i].date=v;
 else if(a==='hs')T.hist[i].skor=+v||0;
 else if(a==='hc'){T.hist[i].cat=v;re=false}
 else if(a==='mtgl'){S.magang.tgl=v;re=false}
 else if(a==='md')S.magang.items[i].d=v;
 else if(a==='mt'){S.magang.items[i].t=v;re=false}
 else if(a==='rd')S.revisi[i].d=v;
 else if(a==='rt'){S.revisi[i].t=v;re=false}
 else if(a==='rf'){S.revisi[i].dari=v;re=false}
 else if(a==='rl'){S.revisi[i].dl=v;re=false}
 else if(a==='it'){S.riset[i].t=v;re=false}
 else if(a==='ip'){S.riset[i].p=+v;var p=document.getElementById('p'+i);if(p)p.textContent=v+'%';re=(e.type==='change')}
 else return;
 save();if(re&&e.type==='change')render();
}
document.addEventListener('change',act);
document.addEventListener('input',function(e){if(e.target.getAttribute('data-a')==='ip')act(e)});
document.addEventListener('click',function(e){
 var el=e.target.closest('button');if(!el)return;
 var a=el.getAttribute('data-a'),i=+el.getAttribute('data-i');
 if(a==='hadd')S.toefl.hist.push({date:'',skor:0,cat:''});
 else if(a==='hx'){if(!confirm('Hapus skor ini?'))return;S.toefl.hist.splice(i,1)}
 else if(a==='madd')S.magang.items.push({t:'',d:false});
 else if(a==='mx')S.magang.items.splice(i,1);
 else if(a==='radd')S.revisi.push({t:'',dari:'',dl:'',d:false});
 else if(a==='rx')S.revisi.splice(i,1);
 else if(a==='iadd')S.riset.push({t:'',p:0});
 else if(a==='ix')S.riset.splice(i,1);
 else return;
 save();render();
});
render();
</script>
</body>
</html>
