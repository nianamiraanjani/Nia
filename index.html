<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nia Namira Anjani</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f4;--card:#fff;--ink:#0f2a20;--mut:#5a7466;--line:#d5e5db;--em:#047857;--soft:#e2f1e9;--bar:#10b981;--btn:#065f46;--btnt:#fff;--warn:#9a3412;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1913;--card:#11251c;--ink:#e5f3ea;--mut:#8db3a0;--line:#21402f;--em:#34d399;--soft:#18332a;--bar:#34d399;--btn:#34d399;--btnt:#062b1e;--warn:#fdba74;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1913;--card:#11251c;--ink:#e5f3ea;--mut:#8db3a0;--line:#21402f;--em:#34d399;--soft:#18332a;--bar:#34d399;--btn:#34d399;--btnt:#062b1e;--warn:#fdba74;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,sans-serif}
.w{max-width:680px;margin:0 auto;padding:12px 12px 150px}
header{margin-bottom:14px}header .m{display:block;margin-top:5px;font-size:13.5px}
h1{font:600 28px/1 "Cormorant Garamond",Georgia,serif;margin:0;color:var(--em)}
h2{font:600 18px/1.2 "Cormorant Garamond",Georgia,serif;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
.grid{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.k,.m{color:var(--mut);font-size:12.5px}.big{font:600 22px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--em)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--em);outline-offset:1px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.f{display:grid;gap:10px;grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}
.b{background:var(--btn);color:var(--btnt);border:0;border-radius:12px;padding:12px 18px;min-height:44px;font:600 14px Manrope,sans-serif;cursor:pointer}
.b.g{background:var(--soft);color:var(--em)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{white-space:nowrap;flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;min-height:38px;border-radius:999px;font:500 14px Manrope,sans-serif;cursor:pointer}
.chip.on{background:var(--btn);color:var(--btnt);border-color:var(--btn)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:20px;padding:6px 10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--bar);border-radius:9px}.bar.o i{background:var(--warn)}
.p{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.ck{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;margin:0;font-size:15px;color:inherit}
.ck input{width:22px;height:22px;accent-color:var(--em);padding:0;flex:none}
.done span{text-decoration:line-through;color:var(--mut)}
.empty{color:var(--mut);padding:6px 0}.mini{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.mn{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dots{display:flex;gap:4px;margin-top:4px}.dots i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--em);background:var(--soft)}.dots i.on{background:var(--em)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:4px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
#nav button{flex:1;background:none;border:0;padding:12px 2px;font:500 12.5px Manrope,sans-serif;color:var(--mut);border-radius:12px;cursor:pointer}
#nav button.on{color:var(--em);background:var(--soft);font-weight:600}
#fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--btn);color:var(--btnt);font-size:32px;line-height:1;z-index:6;box-shadow:0 6px 18px rgba(4,120,87,.35);cursor:pointer}
#bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:8}#bk.on{display:block}
#sh{display:none;position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:9;max-width:680px;margin:0 auto}#sh.on{display:block}
#lock{display:none;position:fixed;inset:0;background:var(--bg);z-index:20;align-items:center;justify-content:center;padding:24px}
#lock.on{display:flex}#lock .card{width:100%;max-width:320px;text-align:center}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--btn);color:var(--btnt);padding:10px 16px;border-radius:999px;z-index:30;display:none;font-size:14px}
#nav{overflow-x:auto}#nav button{font-size:11.5px;padding:12px 0;min-width:48px}details.card>summary::-webkit-details-marker{display:none}
</style></head>
<body>
<div id="lock"></div>
<div class="w"><header><h1>Hai, Nia Namira Anjani</h1><span class="m" id="dt"></span></header><div id="sub"></div><main id="app"></main></div>
<button id="fab" aria-label="Tambah" onclick="pick()">+</button>
<nav id="nav"></nav><div id="bk" onclick="closeSh()"></div><div id="sh"></div><div id="ts"></div>
<script>
const POS=["Food and Groceries","Kosmetik","Jajan","Fashion","Akademik","Fun","Sedekah"],SUMBER=["Aa","Tf Bapak","Qris Bapak","Previous Saldo"],TAB=["Bank Jago","BSI AA","RDPU Nikah","RDPU Skripsi","RDPU Family","RDPU Ilmu"];
const DP=POS.slice(),DS=SUMBER.slice();
const TABS=[["hari","Hari ini"],["uang","Uang"],["tugas","Tugas"],["cat","Catatan"],["lain","Lainnya"]];
const SUB={uang:[["ring","Ringkasan"],["riw","Riwayat"],["bud","Budget"],["sav","Tabungan"],["tag","Tagihan"],["gr","Grafik"]],tugas:[["tugas","Tugas"],["keb","Kebiasaan"],["jad","Jadwal"]],cat:[["notes","Catatan"],["wish","Wishlist"]]};
const BASE={jr:[],rel:[],cyc:[],plants:[],wash:[],lau:[],lib:[],ses:[],en:{},meals:{},jad:[],tx:[],bud:{},sav:[],tgt:{},tdl:{},tasks:[],habits:[],bills:[],notes:[],wish:[],done:{},pin:""};
let S=JSON.parse(JSON.stringify(BASE));
try{const r=JSON.parse(localStorage.getItem("nm1")||"null");if(r){if(r.daily||r.monthly){r.tasks=(r.tasks||[]).concat((r.daily||[]).map(x=>({id:x.id,t:x.t,rep:"daily",pri:2})),(r.monthly||[]).map(x=>({id:x.id,t:x.t,rep:"monthly",pri:2})));delete r.daily;delete r.monthly}Object.assign(S,r)}}catch(e){}
const $=i=>document.getElementById(i),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>{n=Math.round(n);return(n<0?"-":"")+"Rp "+Math.abs(n).toLocaleString("id-ID")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),sum=a=>a.reduce((s,x)=>s+x.amt,0),iso=d=>d.toLocaleDateString("sv");
const save=()=>{try{localStorage.setItem("nm1",JSON.stringify(S))}catch(e){}};
const mig=()=>{S.tx.forEach(x=>{if(x.pos==="Tf Qris")x.pos="Qris Bapak"})};mig();save();
const MC0={sym:["Kram","Sakit kepala","Kembung","Mood naik-turun","Nyeri payudara","Jerawat","Lelah","Mual"],mt:["Pagi","Siang","Malam","Camilan"],jty:["Kelas","Shift kerja","Mengajar","Lainnya"],tags:["tidur cukup","ibadah","olahraga","kuliah","kerja","keluarga"],txt:{Haid:"Tubuhmu sedang melepas. Pelan-pelan, hangatkan diri ya 🤍",Folikuler:"Energi biasanya mulai naik. Enak untuk memulai hal baru 🌱",Subur:"Biasanya paling berenergi. Tetap dengarkan tubuhmu ✨",Luteal:"Boleh lebih pelan dan lembut pada diri sendiri 🍃"},pLo:0,pHi:0,fast:false,libur:false,paid:0,fm:25,bm:5,len:28};
function mintInit(){["jr","rel","cyc","plants","wash","lau","lib","ses"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});["en","meals"].forEach(k=>{if(!S[k]||typeof S[k]!=="object"||Array.isArray(S[k]))S[k]={}});S.mc=Object.assign({},MC0,S.mc||{});S.mc.txt=Object.assign({},MC0.txt,S.mc.txt||{})}
 function initCats(){mintInit();if(!S.cats)S.cats={out:DP.slice(),in:DS.slice()};POS.splice(0,POS.length,...S.cats.out);SUMBER.splice(0,SUMBER.length,...S.cats.in)}initCats();
let today=iso(new Date()),ym=today.slice(0,7),tab="hari",sb={uang:"ring",tugas:"tugas",cat:"notes"},q="",fj="all",F={},CUR={},FV=[];
const bar=(p,o)=>`<div class="bar${o?" o":""}"><i style="width:${Math.min(100,Math.max(0,p))}%"></i></div>`;
function toast(t){const e=$("ts");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1600)}
function go(t){tab=t;draw();scrollTo(0,0)}function gs(s){sb[tab]=s;draw()}
function mv(d){const[y,m]=ym.split("-").map(Number),x=new Date(y,m-1+d,1);ym=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");draw()}
const mn=()=>{const[y,m]=ym.split("-").map(Number);return`<div class="mn"><button class="chip" onclick="mv(-1)" aria-label="Bulan lalu">‹</button><b>${new Date(y,m-1,1).toLocaleDateString("id-ID",{month:"long",year:"numeric"})}</b><button class="chip" onclick="mv(1)" aria-label="Bulan depan">›</button></div>`};
const inM=x=>x.d.slice(0,7)===ym,kind=(a,j)=>a.filter(x=>x.j===j);
function stats(){const m=S.tx.filter(inM);return{m,inc:sum(kind(m,"in")),out:sum(kind(m,"out")),saldo:sum(kind(S.tx,"in"))-sum(kind(S.tx,"out"))-sum(S.sav),tab:sum(S.sav)}}
const spent=(p,m)=>sum(m.filter(x=>x.j==="out"&&x.pos===p));
function brk(list,type,s){const t=type==="out"?s.out:s.inc;return list.map(p=>{const v=sum(s.m.filter(x=>x.j===type&&x.pos===p)),pc=t?v/t*100:0;return`<div style="margin-bottom:12px"><div class="p"><b>${esc(p)}</b><span>${fmt(v)} · ${pc.toFixed(1)}%</span></div>${bar(pc)}</div>`}).join("")}
/* sheet */
function sh(h){$("sh").innerHTML=h;$("sh").className="on";$("bk").className="on"}
function closeSh(){$("sh").className="";$("bk").className=""}
function pick(){sh(`<h2>Tambah</h2><div class="grid"><button class="b" onclick="txSheet(null,'out')">Pengeluaran</button><button class="b" onclick="txSheet(null,'in')">Pemasukan</button><button class="b g" onclick="opn('task')">Tugas</button><button class="b g" onclick="opn('habit')">Kebiasaan</button><button class="b g" onclick="opn('bill')">Tagihan</button><button class="b g" onclick="opn('jad')">Jadwal</button><button class="b g" onclick="opn('note')">Catatan</button><button class="b g" onclick="opn('wish')">Wishlist</button><button class="b g" onclick="opn('plant')">Tanaman</button><button class="b g" onclick="opn('wash')">Nyuci</button><button class="b g" onclick="opn('lau')">Jemuran</button><button class="b g" onclick="closeSh();sb.jur='tulis';go('jur')">Tulis jurnal</button></div>`)}
/* transaksi */
function favs(){const c={};S.tx.filter(x=>x.j==="out").forEach(x=>{const k=x.pos+"|"+x.amt;c[k]=(c[k]||0)+1});return Object.keys(c).filter(k=>c[k]>=2).sort((a,b)=>c[b]-c[a]).slice(0,4).map(k=>{const i=k.lastIndexOf("|");return[k.slice(0,i),+k.slice(i+1)]})}
function txSheet(id,j){const x=id&&S.tx.find(t=>t.id===id);F=x?Object.assign({},x,{a:x.amt}):{j:j||"out",d:today,pos:(j==="in"?SUMBER:POS)[0],a:0,n:""};txRender()}
function sy(){if($("fa")){F.a=+$("fa").value||0;F.d=$("fd").value;F.n=$("fn").value}}
function txRender(){const L=F.j==="in"?SUMBER:POS,fv=FV=!F.id&&F.j==="out"?favs():[];
sh(`<h2>${F.id?"Ubah transaksi":"Catat transaksi"}</h2>${fv.length?`<label>Cepat, sekali ketuk</label><div class="chips" style="margin-bottom:10px">${fv.map((f,j)=>`<button class="chip" onclick="quick(${j})">${esc(f[0])} ${fmt(f[1])}</button>`).join("")}</div>`:""}
<div class="chips" style="margin-bottom:10px"><button class="chip ${F.j==="out"?"on":""}" onclick="tj('out')">Pengeluaran</button><button class="chip ${F.j==="in"?"on":""}" onclick="tj('in')">Pemasukan</button></div>
<label>${F.j==="in"?"Sumber":"Pos"}</label><div class="chips">${L.map((p,i)=>`<button class="chip ${F.pos===p?"on":""}" onclick="tp(this,${i})">${esc(p)}</button>`).join("")}<button class="chip" onclick="catSheet()">⚙ Kelola</button></div>
<label style="margin-top:10px">Nominal</label><input id="fa" type="number" min="0" inputmode="numeric" value="${F.a||""}" placeholder="0">
<div class="chips" style="margin:8px 0">${[10000,20000,50000,100000].map(n=>`<button class="chip" onclick="pl(${n})">+${n/1000}rb</button>`).join("")}</div>
<div class="f"><div><label>Tanggal</label><input id="fd" type="date" value="${F.d}"></div><div><label>Catatan</label><input id="fn" value="${esc(F.n)}" placeholder="Opsional"></div></div>
<div class="mini" style="margin-top:14px"><button class="b" onclick="txSave()">Simpan</button>${F.id?`<button class="b g" onclick="txDel()">Hapus</button>`:""}<button class="b g" onclick="closeSh()">Batal</button></div>`)}
function tj(j){sy();F.j=j;F.pos=(j==="in"?SUMBER:POS)[0];txRender()}
function tp(el,i){F.pos=(F.j==="in"?SUMBER:POS)[i];el.parentNode.querySelectorAll(".chip").forEach(c=>c.classList.remove("on"));el.classList.add("on")}
function pl(n){sy();F.a=(F.a||0)+n;$("fa").value=F.a}
function txSave(){sy();if(!(F.a>0)){$("fa").focus();return}const o={id:F.id||uid(),j:F.j,d:F.d||today,pos:F.pos,amt:F.a,n:F.n.trim()};if(F.bid){o.bid=F.bid;o.bm=F.bm}
if(F.id)S.tx[S.tx.findIndex(x=>x.id===F.id)]=o;else S.tx.push(o);save();closeSh();draw();toast("Tersimpan")}
function txDel(){S.tx=S.tx.filter(x=>x.id!==F.id);save();closeSh();draw()}
function quick(j){const[p,a]=FV[j];S.tx.push({id:uid(),j:"out",d:today,pos:p,amt:a,n:""});save();closeSh();draw();toast("Tersimpan: "+p+" "+fmt(a))}
/* item umum */
const DN=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const KIND={
task:{list:"tasks",title:"tugas",req:"t",def:()=>({rep:"once",pri:2,days:[]}),fs:()=>[{k:"t",l:"Tugas",t:"text",w:1},{k:"rep",l:"Ulangi",t:"sel",o:[["once","Sekali"],["daily","Tiap hari"],["days","Hari tertentu"],["monthly","Tiap bulan"]],oc:"chg()"},{k:"pri",l:"Prioritas",t:"sel",o:[[2,"Biasa"],[3,"Penting"]]}].concat(F.rep==="days"?[{t:"days"}]:[],F.rep==="once"?[{k:"due",l:"Tenggat",t:"date"}]:[])},
habit:{list:"habits",title:"kebiasaan",req:"t",def:()=>({}),fs:()=>[{k:"t",l:"Nama kebiasaan (mis. salat dhuha, olahraga)",t:"text",w:1}]},
bill:{list:"bills",title:"tagihan bulanan",req:"t",def:()=>({day:1,pos:POS[0]}),fs:()=>[{k:"t",l:"Nama tagihan",t:"text",w:1},{k:"amt",l:"Nominal",t:"number"},{k:"day",l:"Jatuh tempo (tanggal)",t:"number"},{k:"pos",l:"Pos",t:"sel",o:POS.map(p=>[p,p])}]},
jad:{list:"jad",title:"jadwal",req:"t",def:()=>({rep:"days",days:[],s:"08:00",e:"09:00",date:today}),fs:()=>[{k:"t",l:"Kegiatan (mis. kuliah, kerja, ngaji)",t:"text",w:1},{k:"rep",l:"Ulangi",t:"sel",o:[["days","Tiap minggu"],["once","Sekali"]],oc:"chg()"}].concat(F.rep==="once"?[{k:"date",l:"Tanggal",t:"date"}]:[{t:"days"}],[{k:"s",l:"Mulai",t:"time"},{k:"e",l:"Selesai",t:"time"},{k:"loc",l:"Tempat (opsional)",t:"text",w:1},{k:"ty",l:"Jenis",t:"sel",o:(S.mc?S.mc.jty:["Kelas","Shift kerja","Mengajar","Lainnya"]).map(x=>[x,x])},{k:"note",l:"Catatan kelas / murid",t:"text",w:1}])},
note:{list:"notes",title:"catatan",req:"t",def:()=>({}),fs:()=>[{k:"t",l:"Judul",t:"text",w:1},{k:"b",l:"Isi",t:"area"}]},
wish:{list:"wish",title:"wishlist",req:"t",def:()=>({}),fs:()=>[{k:"t",l:"Barang",t:"text",w:1},{k:"amt",l:"Perkiraan harga",t:"number"}]}};
function field(f){const v=F[f.k]==null?"":F[f.k],id="f_"+f.k,w=f.w?' class="wide"':"";
if(f.t==="sel")return`<div${w}><label>${f.l}</label><select id="${id}" ${f.oc?`onchange="${f.oc}"`:""}>${f.o.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select></div>`;
if(f.t==="area")return`<div class="wide"><label>${f.l}</label><textarea id="${id}" rows="6">${esc(v)}</textarea></div>`;
if(f.t==="days")return`<div class="wide"><label>Hari</label><div class="chips">${DN.map((d,i)=>`<button type="button" class="chip ${(F.days||[]).includes(i)?"on":""}" onclick="tday(${i})">${d}</button>`).join("")}</div></div>`;
return`<div${w}><label>${f.l}</label><input id="${id}" type="${f.t}" value="${esc(v)}" ${f.t==="number"?'min="0" inputmode="numeric"':""}></div>`}
function rd(){CUR.fs().forEach(f=>{const e=$("f_"+f.k);if(e)F[f.k]=f.t==="number"?+e.value:e.value})}
function form(){sh(`<h2>${CUR.title}</h2><div class="f">${CUR.fs().map(field).join("")}</div><div class="mini" style="margin-top:14px"><button class="b" onclick="isave()">Simpan</button>${F.id?`<button class="b g" onclick="idel()">Hapus</button>`:""}<button class="b g" onclick="closeSh()">Batal</button></div>`)}
function chg(){rd();form()}function tday(i){rd();F.days=F.days||[];const k=F.days.indexOf(i);k<0?F.days.push(i):F.days.splice(k,1);form()}
function opn(k,id){const K=KIND[k],it=id&&S[K.list].find(x=>x.id===id);F=it?JSON.parse(JSON.stringify(it)):K.def();CUR={k,title:(it?"Ubah ":"Tambah ")+K.title,fs:K.fs};form()}
function isave(){rd();const K=KIND[CUR.k];if(!String(F[K.req]||"").trim()){$("f_"+K.req).focus();return}const o=JSON.parse(JSON.stringify(F));if(o.pri)o.pri=+o.pri;
if(o.id)S[K.list][S[K.list].findIndex(x=>x.id===o.id)]=o;else{o.id=uid();S[K.list].push(o)}save();closeSh();draw();toast("Tersimpan")}
function idel(){const K=KIND[CUR.k];S[K.list]=S[K.list].filter(x=>x.id!==F.id);save();closeSh();draw()}
function tg(k){S.done[k]?delete S.done[k]:S.done[k]=1;save();draw()}
/* tugas & kebiasaan */
const tkey=x=>x.rep==="once"||!x.rep?"o:"+x.id:x.rep==="monthly"?"m:"+today.slice(0,7)+":"+x.id:"d:"+today+":"+x.id;
const showT=x=>x.rep==="daily"||x.rep==="monthly"||(x.rep==="days"?(x.days||[]).includes(new Date().getDay()):(!S.done[tkey(x)]&&(!x.due||x.due<=today)));
const RL={daily:"Tiap hari",days:"Hari tertentu",monthly:"Tiap bulan"};
function dl(d){return new Date(d+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short"})}
function trow(x){const k=tkey(x),d=S.done[k],late=(x.rep==="once"||!x.rep)&&x.due&&x.due<today&&!d;

 h+='<div class="row"><label class="mu" style="width:92px">Tanggal ulang</label><input type="date" value="'+esc(T.tglUlang)+'" data-a="ttgl"></div>';
 h+='<div class="mu" style="margin-top:8px">Riwayat skor</div>';
 T.hist.forEach(function(x,i){h+='<div class="row"><input type="date" value="'+esc(x.date)+'" data-a="hd" data-i="'+i+'" style="max-width:140px"><input type="number" value="'+esc(x.skor)+'" data-a="hs" data-i="'+i+'" style="max-width:80px"><input type="text" value="'+esc(x.cat)+'" data-a="hc" data-i="'+i+'"><button class="x" data-a="hx" data-i="'+i+'">\u2715</button></div>'});
 h+='<button data-a="hadd">+ Tambah skor</button></div>';
 // Seminar magang
 var M=S.magang,md=M.items.filter(function(x){return x.d}).length,mp=pct(md,M.items.length);
 h+='<div class="card"><h2>🌽 Seminar Hasil Magang</h2><div class="mu">'+md+' dari '+M.items.length+' langkah \u00b7 '+mp+'%</div>'+bar(mp);
 h+='<div class="row"><label class="mu" style="width:92px">Tgl seminar</label><input type="date" value="'+esc(M.tgl)+'" data-a="mtgl"></div>';
 M.items.forEach(function(x,i){h+='<div class="row'+(x.d?' done':'')+'"><input type="checkbox" data-a="md" data-i="'+i+'"'+(x.d?' checked':'')+'><input type="text" value="'+esc(x.t)+'" data-a="mt" data-i="'+i+'"><button class="x" data-a="mx" data-i="'+i+'">\u2715</button></div>'});
 h+='<button data-a="madd">+ Tambah langkah</button></div>';
 // Revisi
 var rd=S.revisi.filter(function(x){return x.d}).length;
 h+='<div class="card"><h2>✏️ Revisi</h2><div class="mu">'+(S.revisi.length?rd+' dari '+S.revisi.length+' revisi selesai':'Belum ada revisi. Tambahkan dari catatan dosen.')+'</div>'+bar(pct(rd,S.revisi.length));
 S.revisi.forEach(function(x,i){h+='<div class="'+(x.d?'done':'')+'" style="margin:8px 0;padding-top:8px;border-top:1px solid var(--bd)"><div class="row"><input type="checkbox" data-a="rd" data-i="'+i+'"'+(x.d?' checked':'')+'><input type="text" value="'+esc(x.t)+'" data-a="rt" data-i="'+i+'" placeholder="Isi revisi"><button class="x" data-a="rx" data-i="'+i+'">\u2715</button></div><div class="row"><input type="text" value="'+esc(x.dari)+'" data-a="rf" data-i="'+i+'" placeholder="Dari siapa / bagian mana" style="font-size:12.5px"><input type="date" value="'+esc(x.dl)+'" data-a="rl" data-i="'+i+'" style="max-width:140px"></div></div>'});
 h+='<button data-a="radd">+ Tambah revisi</button></div>';
 // Riset
 var ra=S.riset.length?Math.round(S.riset.reduce(function(a,x){return a+x.p},0)/S.riset.length):0;
 h+='<div class="card"><h2>🌶️ Progres Penelitian</h2><div class="mu">Edible coating pati singkong + sorbitol pada cabai rawit</div><div class="big">'+ra+'%</div>'+bar(ra);
 S.riset.forEach(function(x,i){h+='<div style="margin:8px 0;padding-top:8px;border-top:1px solid var(--bd)"><div class="row"><input type="text" value="'+esc(x.t)+'" data-a="it" data-i="'+i+'"><button class="x" data-a="ix" data-i="'+i+'">\u2715</button></div><div class="row"><input type="range" min="0" max="100" step="5" value="'+x.p+'" data-a="ip" data-i="'+i+'"><span class="pill" id="p'+i+'">'+x.p+'%</span></div></div>'});
 h+='<button data-a="iadd">+ Tambah tahap</button></div>';
 document.getElementById('app').innerHTML=h;
}

function act(e){
 var el=e.target,a=el.getAttribute('data-a');if(!a)return;
 var i=+el.getAttribute('data-i'),v=el.type==='checkbox'?el.checked:el.value,re=true;
 var T=S.toefl;
 if(a==='haf')S.hafalan[i].d=v;
 else if(a==='tmin')T.min=+v||0;
 else if(a==='ttar')T.target=+v||0;
 else if(a==='tul')T.ulang=v;
 else if(a==='ttgl')T.tglUlang=v;
 else if(a==='hd')T.hist[i].date=v;
 else if(a==='hs')T.hist[i].skor=+v||0;
 else if(a==='hc'){T.hist[i].cat=v;re=false}
 else if(a==='mtgl'){S.magang.tgl=v;re=false}
 else if(a==='md')S.magang.items[i].d=v;
 else if(a==='mt'){S.magang.items[i].t=v;re=false}
 else if(a==='rd')S.revisi[i].d=v;
 else if(a==='rt'){S.revisi[i].t=v;re=false}
 else if(a==='rf'){S.revisi[i].dari=v;re=false}
 else if(a==='rl'){S.revisi[i].dl=v;re=false}
 else if(a==='it'){S.riset[i].t=v;re=false}
 else if(a==='ip'){S.riset[i].p=+v;var p=document.getElementById('p'+i);if(p)p.textContent=v+'%';re=(e.type==='change')}
 else return;
 save();if(re&&e.type==='change')render();
}
document.addEventListener('change',act);
document.addEventListener('input',function(e){if(e.target.getAttribute('data-a')==='ip')act(e)});
document.addEventListener('click',function(e){
 var el=e.target.closest('button');if(!el)return;
 var a=el.getAttribute('data-a'),i=+el.getAttribute('data-i');
 if(a==='hadd')S.toefl.hist.push({date:'',skor:0,cat:''});
 else if(a==='hx'){if(!confirm('Hapus skor ini?'))return;S.toefl.hist.splice(i,1)}
 else if(a==='madd')S.magang.items.push({t:'',d:false});
 else if(a==='mx')S.magang.items.splice(i,1);
 else if(a==='radd')S.revisi.push({t:'',dari:'',dl:'',d:false});
 else if(a==='rx')S.revisi.splice(i,1);
 else if(a==='iadd')S.riset.push({t:'',p:0});
 else if(a==='ix')S.riset.splice(i,1);
 else return;
 save();render();
});
render();
</script>
</body>
</html>
